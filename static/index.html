<!DOCTYPE html>
<html>
<head>
	<title>Seclog</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <h1>SecLog</h1>
            <div class="tagline">Security Log Monitor</div>

            <div id="login-form">
                <input id="username" placeholder="Username">
                <input id="password" type="password" placeholder="Password">
                <button onclick="login()">Sign In</button>
		<div class="auth-switch" id="signup-link-wrap">No account? <a href="#" onclick="showSignup()">Create one</a></div>
            </div>

            <div id="signup-form" style="display:none;">
                <input id="signup-username" placeholder="Username">
                <input id="signup-password" type="password" placeholder="Password">
		<input id="signup-password-confirm" type="password" placeholder="Confirm Password">
		<div class="hint">Minimum 15 characters</div>
                <button onclick="signup()">Create Account</button>
                <div class="auth-switch">Have an account? <a href="#" onclick="showLogin()">Sign in</a></div>
            </div>

            <div id="mfa-form" style="display:none;">
                <div class="hint" style="text-align:center; margin-bottom:0.75rem;">Enter the 6-digit code from your authenticator app.</div>
                <input id="mfa-code" placeholder="6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                <button onclick="verifyMfaLogin()">Verify</button>
                <div class="auth-switch"><a href="#" onclick="cancelMfaLogin()">Back to sign in</a></div>
            </div>

            <div id="result"></div>
        </div>
    </div>

	<script>
		function showSignup() {
			document.getElementById('login-form').style.display = 'none';
			document.getElementById('signup-form').style.display = 'block';
			document.getElementById('result').innerText = '';
		}

		function showLogin() {
			document.getElementById('signup-form').style.display = 'none';
			document.getElementById('mfa-form').style.display = 'none';
			document.getElementById('login-form').style.display = 'block';
			document.getElementById('result').innerText = '';
		}

		function showMfaPrompt() {
			document.getElementById('login-form').style.display = 'none';
			document.getElementById('signup-form').style.display = 'none';
			document.getElementById('mfa-form').style.display = 'block';
			document.getElementById('result').innerText = '';
			document.getElementById('mfa-code').value = '';
			document.getElementById('mfa-code').focus();
		}

		function cancelMfaLogin() {
			mfaPendingToken = null;
			document.getElementById('password').value = '';
			showLogin();
		}

		// Not a session credential -- just proof the password already
		// checked out, scoped to a single pending TOTP attempt. Kept only
		// in memory (not sessionStorage/localStorage): if the tab is
		// closed mid-MFA-prompt, the login simply has to restart, which is
		// the right failure mode for an in-progress authentication step.
		let mfaPendingToken = null;

		async function login() {
			const username = document.getElementById('username').value;
			const password = document.getElementById('password').value;

			const response = await fetch('/login', {
				method: 'POST',
				credentials: 'include',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ username, password })
			});

			if (response.ok) {
				const data = await response.json();

				if (data.mfa_required) {
					mfaPendingToken = data.pending_token;
					showMfaPrompt();
					return;
				}

				// The session itself now lives in an httpOnly cookie the
				// server just set on this response -- nothing for JS to
				// store. must_change_password is just a UX hint for which
				// screen to show; the server enforces the real rule.
				sessionStorage.setItem('must_change_password', data.must_change_password ? 'true' : 'false');
				window.location.href = '/app.html';
			} else {
				document.getElementById('result').innerText =
					'Login failed: ' + response.status;
			}
		}

		async function verifyMfaLogin() {
			const code = document.getElementById('mfa-code').value.trim();

			if (!/^\d{6}$/.test(code)) {
				document.getElementById('result').innerText = 'Enter the 6-digit code.';
				return;
			}
			if (!mfaPendingToken) {
				document.getElementById('result').innerText = 'Session expired -- please sign in again.';
				showLogin();
				return;
			}

			const response = await fetch('/mfa/login-verify', {
				method: 'POST',
				credentials: 'include',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ pending_token: mfaPendingToken, code })
			});

			if (response.ok) {
				const data = await response.json();
				mfaPendingToken = null;
				sessionStorage.setItem('must_change_password', data.must_change_password ? 'true' : 'false');
				window.location.href = '/app.html';
			} else if (response.status === 401) {
				document.getElementById('result').innerText = 'Incorrect code. Try again.';
			} else if (response.status === 429) {
				document.getElementById('result').innerText = 'Too many attempts. Please wait and try again.';
			} else {
				document.getElementById('result').innerText = 'Verification failed: ' + response.status;
			}
		}

		async function signup() {
			const username = document.getElementById('signup-username').value;
			const password = document.getElementById('signup-password').value;
			const confirmPassword = document.getElementById('signup-password-confirm').value;

			if (password !== confirmPassword) {
        			document.getElementById('result').innerText = 'Passwords do not match.';
        			return;
    			}

			if (!username || password.length < 15) {
				document.getElementById('result').innerText =
					'Username required, password must be at least 15 characters.';
				return;
			}

			const response = await fetch('/signup', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ username, password })
			});

			if (response.ok) {
				// Account created -- log them straight in rather than
				// making them re-type credentials on a separate screen.
				document.getElementById('signup-username').value = username;
				document.getElementById('signup-password').value = password;

				const loginResp = await fetch('/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password })
				});

				if (loginResp.ok) {
					const data = await loginResp.json();
					sessionStorage.setItem('must_change_password', data.must_change_password ? 'true' : 'false');
					window.location.href = '/app.html';
				}
			} else if (response.status === 409) {
				document.getElementById('result').innerText =
					'That username is already taken.';
			} else if (response.status === 403) {
				document.getElementById('result').innerText =
					'Self-signup is disable. Contact and administrator.';
			} else {
				document.getElementById('result').innerText =
					'Signup failed: ' + response.status;
			}
		}

		document.getElementById('password').addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				login();
			}
		});
		document.getElementById('signup-password').addEventListener('keydown', (e) => {
			if (e.key === 'Enter') signup();
		});
		document.getElementById('signup-password-confirm').addEventListener('keydown', (e) => {
    			if (e.key === 'Enter') signup();
		});
		document.getElementById('mfa-code').addEventListener('keydown', (e) => {
			if (e.key === 'Enter') verifyMfaLogin();
		});

		async function checkSignupStatus() {
    			try {
        			const resp = await fetch('/signup-status');
        			const data = await resp.json();
        			if (!data.enabled) {
            				document.getElementById('signup-link-wrap').style.display = 'none';
        			}
				if (data.bootstrap) {
					showSignup();
				}
    			} catch (e) { /* fail open visually -- server enforces regardless */ }
		}
		checkSignupStatus();
	</script>
</body>
</html>
