services:
  mariadb:
    image: mariadb:11
    container_name: seclog-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - seclog_db_data:/var/lib/mysql

  app:
    image: ghcr.io/lordsodomiser/seclog:latest
    container_name: seclog-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Note: "mariadb" here is the DB's service name above, not 127.0.0.1 --
      # inside Docker's internal network, containers reach each other by
      # service name, not localhost. This is an important shift from how
      # your Rust binary connected to it during local (non-Docker) testing.
      DATABASE_URL: mysql://${DB_USER}:${DB_PASS}@mariadb:3306/${DB_NAME}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  seclog_db_data:
